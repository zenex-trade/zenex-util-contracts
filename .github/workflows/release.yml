name: Release

# A version tag builds each contract at that version with stellar.expert's
# reusable workflow, pinned to its v27.0.0 commit, which builds with Stellar
# CLI 27.0.0. Each build
# job publishes a GitHub release with the optimized WASM, attests its build
# provenance and submits the WASM hash to stellar.expert, which marks a contract
# running that exact WASM as verified against this source. Deploy the WASMs
# from these releases. See the README's Releases section.
#
# The build embeds the repository name as the `source_repo` contract meta, so
# the same tag gives other hashes in another repository. Every job therefore
# runs in the public repository only. `make release` rebuilds the same files
# locally.
#
# The jobs run one after another, chained with `needs`. stellar.expert does not
# register most submissions when several arrive at once, so the builds are
# spaced out and the last job submits every build again, one at a time.
on:
  push:
    tags:
      # Exact versions only: the per-contract release tags the jobs create
      # (`v1.2.3_<package>_...`) never match.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write
  contents: write
  attestations: write

# No `relative_path`: the crates are members of the root workspace, so each
# job builds from the root with `package`.
jobs:
  # Lists the contract crates whose version is the tag's: only those are built.
  # A crate at another version keeps its earlier release. Fails if no crate
  # matches the tag.
  check-version:
    if: github.repository == 'zenex-trade/zenex-util-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # The matching packages, each between commas: `,session-policy,guardian,`.
      packages: ${{ steps.match.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match the tag with the crate versions
        id: match
        env:
          TAG: ${{ github.ref_name }}
          PACKAGES: fee-forwarder market-router session-policy referral wallet-factory guardian
        run: |
          matched=","
          for package in $PACKAGES; do
            version=$(grep -m1 '^version = ' "$package/Cargo.toml" | cut -d '"' -f2)
            if [ "v$version" = "$TAG" ]; then
              matched="$matched$package,"
            else
              echo "$package is version $version: not built"
            fi
          done
          if [ "$matched" = "," ]; then
            echo "::error::no contract crate is at version ${TAG#v}"
            exit 1
          fi
          echo "packages=$matched" >> "$GITHUB_OUTPUT"

  # The build jobs run one after another, so their submissions to
  # stellar.expert are spaced. A job that fails does not stop the ones after
  # it: each runs unless the run is cancelled or the version check failed.
  # The reusable workflow publishes a contract's release before it submits and
  # attests it, so a job that failed after publishing cannot simply be re-run.
  # Delete that contract's release and its tag first
  # (`gh release delete <tag>_<package>_cli27.0.0 --cleanup-tag`), then re-run
  # the failed job.
  fee-forwarder:
    if: ${{ !cancelled() && github.repository == 'zenex-trade/zenex-util-contracts' && needs.check-version.result == 'success' && contains(needs.check-version.outputs.packages, ',fee-forwarder,') }}
    needs: check-version
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'fee-forwarder'
      package: 'fee-forwarder'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  market-router:
    if: ${{ !cancelled() && github.repository == 'zenex-trade/zenex-util-contracts' && needs.check-version.result == 'success' && contains(needs.check-version.outputs.packages, ',market-router,') }}
    needs: [check-version, fee-forwarder]
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'market-router'
      package: 'market-router'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  session-policy:
    if: ${{ !cancelled() && github.repository == 'zenex-trade/zenex-util-contracts' && needs.check-version.result == 'success' && contains(needs.check-version.outputs.packages, ',session-policy,') }}
    needs: [check-version, market-router]
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'session-policy'
      package: 'session-policy'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  referral:
    if: ${{ !cancelled() && github.repository == 'zenex-trade/zenex-util-contracts' && needs.check-version.result == 'success' && contains(needs.check-version.outputs.packages, ',referral,') }}
    needs: [check-version, session-policy]
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'referral'
      package: 'referral'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  wallet-factory:
    if: ${{ !cancelled() && github.repository == 'zenex-trade/zenex-util-contracts' && needs.check-version.result == 'success' && contains(needs.check-version.outputs.packages, ',wallet-factory,') }}
    needs: [check-version, referral]
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'wallet-factory'
      package: 'wallet-factory'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  guardian:
    if: ${{ !cancelled() && github.repository == 'zenex-trade/zenex-util-contracts' && needs.check-version.result == 'success' && contains(needs.check-version.outputs.packages, ',guardian,') }}
    needs: [check-version, wallet-factory]
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'guardian'
      package: 'guardian'
      home_domain: 'app.zenex.trade'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  # Submits every build of this run to stellar.expert again, one at a time with a pause in
  # between. Each contract's hash is the SHA-256 of the release asset its build
  # job published: release `<tag>_<package>_cli<cli version>`, file
  # `<package>_v<version>.wasm`. The request is the one the reusable workflow
  # sends in its "Send release info" step, with that workflow's job id
  # (`build`) and this run's id, which is the run the build jobs ran in.
  # Re-running this job alone (re-run failed jobs) keeps the run id and
  # submits again.
  resubmit:
    if: ${{ !cancelled() && github.repository == 'zenex-trade/zenex-util-contracts' && needs.check-version.result == 'success' }}
    needs: [check-version, guardian]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Submit each release to stellar.expert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          COMMIT_HASH: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          TAG: ${{ github.ref_name }}
          # The CLI version the pinned reusable workflow builds with; it is
          # part of the release names.
          CLI_VERSION: 27.0.0
          PACKAGES: ${{ needs.check-version.outputs.packages }}
          PAUSE_SECONDS: 60
        run: |
          status=0
          first=1
          for package in $(echo "$PACKAGES" | tr ',' ' '); do
            if [ "$first" = 1 ]; then first=0; else sleep "$PAUSE_SECONDS"; fi

            release="${TAG}_${package}_cli${CLI_VERSION}"
            file="${package}_${TAG}.wasm"
            dir="$RUNNER_TEMP/$package"
            mkdir -p "$dir"
            if ! gh release download "$release" --pattern "$file" --dir "$dir"; then
              echo "::error::no asset $file in release $release"
              status=1
              continue
            fi
            hash=$(sha256sum "$dir/$file" | cut -d ' ' -f1)

            body=$(jq -cn \
              --arg repository "$REPOSITORY" \
              --arg commitHash "$COMMIT_HASH" \
              --arg runId "$RUN_ID" \
              --arg contractHash "$hash" \
              --arg packageName "$package" \
              '{repository: $repository, commitHash: $commitHash, jobId: "build", runId: $runId, contractHash: $contractHash, packageName: $packageName}')
            echo "$package: $body"

            code=$(curl -sS -o "$dir/response" -w '%{http_code}' \
              -X POST "https://api.stellar.expert/explorer/public/contract-validation/match" \
              -H "Content-Type: application/json" \
              -d "$body" --max-time 30) || code=000
            echo "$package: HTTP $code $(cat "$dir/response" 2>/dev/null)"
            case "$code" in
              2*) ;;
              *) echo "::error::stellar.expert did not accept $package (HTTP $code)"; status=1 ;;
            esac
          done
          exit $status
