name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The version the release workflow builds with; the Makefile pins the same.
  STELLAR_CLI_VERSION: 27.0.0

jobs:
  test:
    name: fmt and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # With no argument, rustup installs the toolchain rust-toolchain.toml
      # pins, with its wasm32v1-none target and rustfmt.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      # Native tests need no built WASM: the only WASMs they load are the
      # committed testdata in guardian/testdata/, market-router/testdata/ and
      # session-policy/testdata/.
      - run: cargo test --locked --workspace
      # `make build` shells out to `stellar contract build --optimize`; the
      # published release binaries ship with the wasm-opt support that flag
      # needs. Pinned so a CLI release cannot change what CI builds.
      - name: Install stellar-cli
        run: |
          mkdir -p "$HOME/.stellar-cli"
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.stellar-cli"
          echo "$HOME/.stellar-cli" >> "$GITHUB_PATH"
          "$HOME/.stellar-cli/stellar" --version
      # The optimized WASMs, built the way the release workflow builds them.
      - run: make build
