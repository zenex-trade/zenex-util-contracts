[workspace]
resolver = "2"
members = [
  "fee-forwarder",
  "guardian",
  "market-router",
  "referral",
  "session-policy",
  "wallet-factory",
]

# The version OpenZeppelin stellar-contracts v0.8.0 builds with. Spec shaking v2
# is always on from soroban-sdk 28, so no feature is needed for it.
[workspace.dependencies.soroban-sdk]
version = "28.0.0"

# OpenZeppelin stellar-contracts v0.8.0, from crates.io. It is the first
# release line with the fee collection the forwarder relies on (OZ PR #873,
# issue #875: Eager collection consumes the whole approval, so no allowance
# outlives the call), and it carries the smart-account fix of advisory
# GHSA-jpg9-m7w4-c7wc (fixed in 0.7.3 and 0.8.0).
[workspace.dependencies.stellar-access]
version = "0.8.0"

[workspace.dependencies.stellar-accounts]
version = "0.8.0"

[workspace.dependencies.stellar-fee-abstraction]
version = "0.8.0"

[workspace.dependencies.stellar-macros]
version = "0.8.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
